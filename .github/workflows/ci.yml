name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Consumers run these files straight from a tag: a syntax error breaks every one of them.
      - run: npm run check
      - run: npm test
