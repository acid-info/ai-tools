name: AI PR Review (shared)

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false

concurrency:
  group: ai-review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/ai-review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Acknowledge trigger (eyes reaction)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes || true

      # Security: the CALLER repo's default branch, never the PR head. Config and guideline
      # files are read from this trusted checkout; the PR diff arrives over the GitHub API by
      # number, so PR-authored code and config never execute in this job.
      - name: Checkout caller default branch (trusted config + guidelines)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      # An empty ref makes actions/checkout fall back to the default branch, silently running
      # code the caller never pinned.
      - name: Resolve the reviewer commit the caller pinned
        env:
          TOOL_REPO: ${{ job.workflow_repository }}
          TOOL_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$TOOL_REPO" ] || [ -z "$TOOL_SHA" ]; then
            echo "::error::Cannot tell which ai-review commit was called (job.workflow_*); refusing to run."
            exit 1
          fi
          echo "Reviewer: $TOOL_REPO@$TOOL_SHA"

      - name: Checkout reviewer program at the ref the caller pinned
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-review-tool

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dual review + synthesis
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: node .ai-review-tool/review.mjs
